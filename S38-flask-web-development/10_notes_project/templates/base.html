<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Notes{% endblock %} &mdash; Kadoos</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        {# Inside a blueprint the endpoint is 'blueprint.function'. #}
        <a class="brand" href="{{ url_for('notes.index') }}">My notes</a>
        <nav>
            <a href="{{ url_for('notes.create') }}">New note</a>
            <a href="{{ url_for('notes.categories') }}">Categories</a>
            <a href="{{ url_for('notes.api_notes') }}">API</a>
        </nav>
    </header>

    <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, text in messages %}
                <div class="flash {{ category }}">{{ text }}</div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <footer>Kadoos Institute &mdash; session 38</footer>
</body>
</html>
